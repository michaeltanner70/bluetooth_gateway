# Bluetooth-Gateway, gemeinsamer Baustein für alle Gateways
# Board: Seeed Studio XIAO ESP32-C6, Speisung über USB-C, externe Antenne.
# Leitet BLE-Geräte als Bluetooth-Proxy an Home Assistant weiter.
#
# Wird nicht direkt geflasht, sondern von einer Instanzdatei pro Gateway
# eingebunden (siehe instanzen/). Liegt im Add-on als common/bt-gateway.yaml.
# Die Instanzdatei liefert Name, API-Schlüssel und Fallback-Hotspot.

substitutions:
  # ESP32-C6: Diagnose-Grenzwerte des common-Packages überschreiben (viel RAM)
  diag_min_heap_ok: "80000"
  diag_min_heap_critical: "40000"
  # Vorgabe, falls die Instanzdatei nichts angibt: extern oder intern
  antenne: extern

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: bluetooth_gateway.gateway
    version: "0.2.0"

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
    # Ohne eigenen Schlüssel: verwendet den API-Schlüssel der Instanz
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# Antennenwahl des XIAO ESP32-C6. Welche Antenne gilt, legt die Instanzdatei
# mit der Substitution "antenne" fest: extern (U.FL) oder intern (Keramik).
# Die Pins werden beim Start gesetzt, noch bevor WLAN und Bluetooth anlaufen.
switch:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
    restore_mode: ALWAYS_OFF  # LOW: HF-Schalter eingeschaltet
    internal: true
  - platform: gpio
    id: antenna_select
    pin: GPIO14
    # HIGH: externe Antenne, LOW: eingebaute Antenne. Ein anderer Wert als
    # extern/intern ergibt einen ungültigen restore_mode und fällt beim Prüfen auf.
    restore_mode: "${ {'extern': 'ALWAYS_ON', 'intern': 'ALWAYS_OFF'}.get(antenne, 'antenne_muss_extern_oder_intern_sein') }"
    internal: true
