# Bluetooth-Gateway
# Board: Seeed Studio XIAO ESP32-C6, Speisung über USB-C, keine weitere Hardware.
# Leitet BLE-Geräte als Bluetooth-Proxy an Home Assistant weiter.

substitutions:
  name: bt-gateway
  friendly_name: Bluetooth Gateway
  # ESP32-C6: Diagnose-Grenzwerte des common-Packages überschreiben (viel RAM)
  diag_min_heap_ok: "80000"
  diag_min_heap_critical: "40000"

# Gemeinsames Diagnose-Package (Original im Repo esphome_apps). Liegt im
# Add-on-Verzeichnis unter common/, Pfad relativ zu dieser Datei.
packages:
  diagnostics: !include common/diagnostics.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: bluetooth_gateway.gateway
    version: "0.2.0"

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret bt_gateway_api_key

ota:
  - platform: esphome
    # Ohne eigenen Schlüssel: verwendet den API-Schlüssel
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback-Hotspot, falls die WLAN-Verbindung fehlschlägt
  ap:
    ssid: !secret bt_gateway_fallback_ap_ssid
    password: !secret bt_gateway_fallback_ap_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

# Antennenwahl des XIAO ESP32-C6, fest auf die externe Antenne (U.FL).
# Die Pins werden beim Start gesetzt, noch bevor WLAN und Bluetooth anlaufen.
# Für die eingebaute Keramikantenne GPIO14 auf ALWAYS_OFF stellen.
switch:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
    restore_mode: ALWAYS_OFF  # LOW: HF-Schalter eingeschaltet
    internal: true
  - platform: gpio
    id: antenna_select
    pin: GPIO14
    restore_mode: ALWAYS_ON  # HIGH: externe Antenne, LOW: eingebaute Antenne
    internal: true
